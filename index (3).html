<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#571B2B">
<title>OUR LITTLE UNIVERSE ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --wine:#571B2B;--burgundy:#8F2638;--beige:#F5EBDD;--cream:#FFF9F1;--rose:#DDA9A4;--cocoa:#302025;
  --ease:cubic-bezier(.22,.8,.3,1);
}
html,body{height:100%;overflow:hidden;background:var(--wine);font-family:'Tajawal',system-ui,sans-serif;color:var(--cocoa)}
h1,h2,h3,.display{font-family:'Alexandria','Tajawal',sans-serif;font-weight:500}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.en{direction:ltr;unicode-bidi:isolate}

/* backgrounds */
.bg{position:fixed;inset:0;z-index:0;transition:opacity 1.4s ease}
.bg-dark{background:radial-gradient(ellipse at 50% 30%,#7b2339 0%,var(--wine) 48%,#2a0d16 100%)}
.bg-light{background:radial-gradient(ellipse at 50% 0%,var(--cream) 0%,var(--beige) 100%);opacity:0}
body.light .bg-light{opacity:1}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
#confetti{position:fixed;inset:0;z-index:60;pointer-events:none}

/* audio */
#yt-host{position:fixed;left:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1;overflow:hidden}
.audio-ctl{position:fixed;z-index:80;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:99px;background:rgba(48,32,37,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);direction:ltr}
.audio-ctl button{width:30px;height:30px;border-radius:50%;color:var(--cream);font-size:18px;position:relative;line-height:30px}
.audio-ctl button.muted::after{content:"";position:absolute;left:5px;right:5px;top:14px;height:2px;background:var(--rose);transform:rotate(-40deg);border-radius:2px}
.audio-ctl input{width:64px;accent-color:var(--rose);height:20px}
.toast{position:fixed;z-index:85;bottom:70px;left:50%;transform:translate(-50%,20px);padding:10px 18px;border-radius:99px;background:var(--cream);color:var(--wine);font-size:.95rem;opacity:0;pointer-events:none;transition:.5s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* scenes */
#app{position:fixed;inset:0;z-index:2}
.scene{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .6s ease,transform .8s var(--ease),visibility .6s;-webkit-overflow-scrolling:touch}
.scene.active{opacity:1;visibility:visible;transform:none}
.scene.dark{color:var(--cream)}
.scene.light{color:var(--cocoa)}
.scene-inner{margin:auto;width:100%;max-width:640px;padding:64px 22px 84px;text-align:center}
.eyebrow{font-family:'Alexandria',sans-serif;letter-spacing:.22em;font-size:.68rem;opacity:.7;text-transform:uppercase;direction:ltr}
.sub{font-size:.95rem;opacity:.8;margin-top:8px}
h2.title{font-size:clamp(1.6rem,6.2vw,2.3rem);line-height:1.5;margin:12px 0 6px}
.light h2.title{color:var(--wine)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:99px;font-size:1.05rem;font-weight:500;transition:transform .3s var(--ease),box-shadow .3s;min-height:48px}
.btn:active{transform:scale(.96)}
.dark .btn{background:var(--cream);color:var(--wine);box-shadow:0 0 0 0 rgba(221,169,164,.6),0 10px 30px rgba(0,0,0,.3);animation:pulseBtn 2.8s infinite}
.light .btn{background:var(--burgundy);color:var(--cream);box-shadow:0 10px 26px rgba(143,38,56,.3)}
.light .btn.ghost{color:var(--burgundy)}
.btn.ghost{background:transparent!important;box-shadow:none!important;animation:none!important;border:1.5px solid currentColor;font-size:.92rem;padding:10px 20px;min-height:42px}
@keyframes pulseBtn{0%{box-shadow:0 0 0 0 rgba(221,169,164,.55),0 10px 30px rgba(0,0,0,.3)}70%{box-shadow:0 0 0 16px rgba(221,169,164,0),0 10px 30px rgba(0,0,0,.3)}100%{box-shadow:0 0 0 0 rgba(221,169,164,0),0 10px 30px rgba(0,0,0,.3)}}

.rv{opacity:0;transform:translateY(20px);transition:opacity 1s ease,transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}

.dots{position:fixed;z-index:70;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);display:flex;gap:8px;opacity:0;transition:opacity .8s;pointer-events:none}
.dots.show{opacity:1}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--rose);opacity:.35;transition:.5s}
.dots i.on{opacity:1;transform:scale(1.4);box-shadow:0 0 8px var(--rose)}

/* scene 1 */
.s1 .heart{width:clamp(120px,34vw,170px);margin:26px auto 22px;filter:drop-shadow(0 0 22px rgba(221,169,164,.75));animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
.s1 h1{font-size:clamp(1.5rem,7vw,2.3rem);letter-spacing:.06em;margin-top:14px;direction:ltr}
.s1 .l1{font-size:1.15rem;line-height:2;margin-top:22px;opacity:.95}
.s1 .l2{font-size:1.2rem;line-height:2;margin:4px 0 30px;color:var(--rose)}
.stagger>*{opacity:0;animation:up 1.1s var(--ease) forwards}
.stagger>*:nth-child(1){animation-delay:.2s}.stagger>*:nth-child(2){animation-delay:.5s}.stagger>*:nth-child(3){animation-delay:.9s}.stagger>*:nth-child(4){animation-delay:1.3s}.stagger>*:nth-child(5){animation-delay:1.9s}.stagger>*:nth-child(6){animation-delay:2.4s}.stagger>*:nth-child(7){animation-delay:2.8s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* scene 2 story */
.story{margin:26px 0 8px;text-align:center}
.story p{font-size:1.12rem;line-height:2.1;margin:0 0 20px}
.story p.en{font-family:'Alexandria',sans-serif;font-size:.98rem;color:var(--burgundy);text-align:center;margin-top:8px}
.tl-head{margin:30px 0 14px;font-size:1.25rem;color:var(--wine)}
.tl{position:relative;text-align:start;margin:10px 0 36px}
.tl::before{content:"";position:absolute;inset-inline-start:11px;top:14px;bottom:14px;width:2px;background:linear-gradient(var(--rose),var(--burgundy),var(--rose));border-radius:2px;opacity:.6}
.tl-row{position:relative;padding-inline-start:48px;padding-block:7px}
.tl-dot{position:absolute;inset-inline-start:2px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--cream);border:2px solid var(--burgundy);box-shadow:0 0 0 4px rgba(221,169,164,.35);transition:.4s;display:grid;place-items:center;font-size:10px;color:var(--burgundy)}
.tl-row.open .tl-dot{background:var(--burgundy);color:var(--cream);box-shadow:0 0 14px 4px rgba(143,38,56,.45)}
.tl-btn{display:inline-block;padding:7px 16px;border-radius:99px;background:rgba(143,38,56,.09);color:var(--burgundy);font-family:'Alexandria',sans-serif;font-size:1rem;direction:ltr;transition:.3s}
.tl-row.open .tl-btn{background:var(--burgundy);color:var(--cream)}
.tl-card{max-height:0;opacity:0;overflow:hidden;transition:max-height .6s var(--ease),opacity .5s,margin .5s}
.tl-row.open .tl-card{max-height:140px;opacity:1;margin-top:10px}
.tl-card div{background:var(--cream);border:1px solid rgba(143,38,56,.18);border-radius:14px;padding:14px 16px;box-shadow:0 8px 22px rgba(87,27,43,.1);font-size:1.08rem;color:var(--cocoa)}

/* scene 3 cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0 34px}
.cards .fc:last-child{grid-column:1/-1}
.fc{perspective:900px;height:150px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .8s var(--ease);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.fc-f{background:rgba(255,249,241,.08);border:1px solid rgba(221,169,164,.4);box-shadow:inset 0 0 30px rgba(221,169,164,.08)}
.fc-f .sym{font-size:1.7rem;color:var(--rose);text-shadow:0 0 14px rgba(221,169,164,.7)}
.fc-f .t{font-size:.98rem;line-height:1.6;font-family:'Alexandria',sans-serif;font-weight:400}
.fc-b{background:var(--cream);color:var(--wine);transform:rotateY(180deg);font-size:1.05rem;line-height:1.8;font-weight:500;box-shadow:0 0 28px rgba(221,169,164,.35)}

/* envelopes */
.env{--c1:#8F2638;--c2:#7a1f30;--c3:#a63246;--seal:#571B2B;position:relative;width:100%;aspect-ratio:4/3;background:var(--c1);border-radius:10px;box-shadow:0 12px 26px rgba(48,32,37,.28);transition:transform .4s var(--ease);color:var(--cream)}
.env.c1{--c1:#E3CFB6;--c2:#EBDAC4;--c3:#D6BE9F;--seal:#8F2638;color:var(--wine)}
.env .e-paper{position:absolute;left:8%;right:8%;top:14%;height:80%;background:var(--cream);border-radius:6px;z-index:1;transition:transform .9s var(--ease) .45s;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.env .e-pocket{position:absolute;inset:0;background:var(--c2);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:10px;z-index:2}
.env .e-flap{position:absolute;left:0;top:0;width:100%;height:56%;background:var(--c3);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;z-index:4;transition:transform .8s var(--ease),z-index 0s .3s;border-radius:10px 10px 0 0}
.env .e-seal{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--seal);color:var(--cream);display:grid;place-items:center;font-size:15px;z-index:5;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:opacity .4s,transform .4s;font-weight:400}
.env .e-num{position:absolute;bottom:9px;inset-inline-end:12px;z-index:6;font-family:'Alexandria',sans-serif;font-size:.78rem;opacity:.85;direction:ltr}
.env.open .e-flap{transform:rotateX(180deg);z-index:0}
.env.open .e-seal{opacity:0;transform:translate(-50%,-50%) scale(.4)}
.env.open .e-paper{transform:translateY(-52%)}
.env.away{opacity:0;transform:translateY(40px) scale(.95);pointer-events:none;transition:opacity .7s,transform .8s var(--ease)}
.env-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;margin:28px 0 30px}
.env-btn{display:block;width:100%;position:relative;transition:transform .35s var(--ease)}
.env-btn:active{transform:scale(.95)}
.env-btn.done::after{content:"✓";position:absolute;top:-8px;inset-inline-start:-6px;width:24px;height:24px;border-radius:50%;background:var(--wine);color:var(--cream);font-size:13px;display:grid;place-items:center;z-index:9}
.env-btn:hover .env{transform:translateY(-4px)}
.hint{font-size:.9rem;opacity:.7;margin-top:6px}

.ov{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(48,12,22,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .5s}
.ov.show{display:flex}.ov.vis{opacity:1}
.ov-stage{display:grid;place-items:center;width:100%;max-width:420px;max-height:100%}
.ov-stage>*{grid-area:1/1}
.ov-stage .env{width:min(78vw,320px)}
.paper{width:100%;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow-y:auto;background:var(--cream);color:var(--cocoa);border-radius:14px;padding:34px 24px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);opacity:0;transform:translateY(30px) scale(.94);transition:opacity .8s,transform .9s var(--ease);pointer-events:none;position:relative;border:1px solid rgba(143,38,56,.15)}
.paper.show{opacity:1;transform:none;pointer-events:auto}
.paper .p-num{font-family:'Alexandria',sans-serif;font-size:.75rem;color:var(--burgundy);letter-spacing:.2em}
.paper .p-heart{color:var(--burgundy);font-size:1.1rem;margin:4px 0 14px}
.paper .p-line{display:block;font-size:1.28rem;line-height:2.25;color:var(--wine)}
.paper .btn{margin-top:20px;font-size:.95rem;padding:10px 24px;min-height:42px}

/* scene 5 cake */
.cake-wrap{position:relative;width:min(80vw,320px);margin:6px auto 0}
.cake-wrap svg{width:100%;height:auto;overflow:visible;display:block}
.hit{cursor:pointer}
.flame{transform-origin:150px 90px;animation:flick .22s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.94,1.07) rotate(2.5deg)}}
.flame.blow{animation:blowf .22s ease-in-out infinite alternate}
@keyframes blowf{from{transform:scale(.85,.9) rotate(-22deg) translateX(-3px)}to{transform:scale(.7,.85) rotate(-36deg) translateX(-6px)}}
.glow{transition:opacity 1.2s}
.wind path{stroke:var(--burgundy);stroke-width:2;fill:none;stroke-linecap:round;opacity:0;stroke-dasharray:40;stroke-dashoffset:40}
.wind.show path{animation:windy 1.1s ease-out infinite}
.wind.show path:nth-child(2){animation-delay:.18s}.wind.show path:nth-child(3){animation-delay:.36s}
@keyframes windy{0%{opacity:0;stroke-dashoffset:40;transform:translateX(30px)}30%{opacity:.7}100%{opacity:0;stroke-dashoffset:-20;transform:translateX(-20px)}}
.smoke circle{fill:rgba(87,27,43,.35);opacity:0}
.smoke.go circle{animation:smoke 3.2s ease-out forwards}
.smoke.go circle:nth-child(2){animation-delay:.35s}.smoke.go circle:nth-child(3){animation-delay:.7s}.smoke.go circle:nth-child(4){animation-delay:1.05s}
@keyframes smoke{0%{opacity:.8;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx,8px),-90px) scale(3)}}
.cake-t1{font-size:clamp(1.45rem,6vw,2rem);color:var(--wine);margin-top:14px}
.cake-t2{font-size:1.25rem;margin-top:6px;color:var(--burgundy)}
.cake-t3{font-size:1.15rem;margin-top:12px;font-family:'Alexandria',sans-serif;direction:ltr;color:var(--wine)}
.cake-hint{font-size:.88rem;opacity:.65;margin-top:6px;transition:opacity .5s}
.cake-hint.hide{opacity:0}
.after{display:none;margin-top:6px}
.after.show{display:block}
.after>*{opacity:0;animation:up 1s var(--ease) forwards}
.after .wish{font-size:1.2rem;line-height:2;color:var(--wine);animation-delay:.9s;margin-top:8px}
.after .hb{font-family:'Alexandria',sans-serif;font-size:1.25rem;color:var(--burgundy);animation-delay:1.8s;direction:ltr;margin:6px 0 16px}
.after .acts{display:flex;flex-direction:column;align-items:center;gap:12px;animation-delay:2.6s}
.fh{position:fixed;z-index:55;bottom:-30px;color:var(--burgundy);pointer-events:none;animation:fhUp linear forwards}
@keyframes fhUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.seq-p .cake-t1,.seq-p .cake-t2,.seq-p .cake-t3,.seq-p .cake-hint{opacity:0;animation:up 1.1s var(--ease) forwards}
.seq-p .cake-t1{animation-delay:.3s}.seq-p .cake-t2{animation-delay:1.6s}.seq-p .cake-t3{animation-delay:3.1s}
.seq-p .cake-hint{animation-delay:4s;animation-fill-mode:forwards}
.seq-p .cake-hint.hide{animation:none;opacity:0}

/* scene 6 final */
.final-env-wrap{max-height:400px;overflow:hidden;transition:max-height 1s var(--ease) .1s,opacity .8s,margin .8s}
.final-env-wrap.gone{max-height:0;opacity:0;margin:0}
.final-env-btn{display:block;width:min(86vw,340px);margin:30px auto 10px;aspect-ratio:4/3;position:relative}
.final-env-btn .env{height:100%;aspect-ratio:auto;box-shadow:0 0 40px rgba(221,169,164,.3),0 14px 34px rgba(0,0,0,.4);--c1:#8F2638;--c2:#7a1f30;--c3:#a63246;--seal:#571B2B}
.final-env-btn .env .e-seal{background:var(--cream);color:var(--burgundy)}
.final-env-btn .cap{position:absolute;left:8%;right:8%;bottom:12%;z-index:6;font-size:.98rem;line-height:1.7;text-align:center;color:var(--cream);transition:opacity .4s}
.final-env-btn .env.open + .cap{opacity:0}
.final-env-btn .env .e-paper{top:10%}
.letter{display:none;background:var(--cream);color:var(--cocoa);border-radius:16px;padding:34px 24px 30px;margin:18px 0 0;text-align:start;box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid rgba(221,169,164,.5)}
.letter.show{display:block;animation:paperIn 1.2s var(--ease)}
@keyframes paperIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.letter p{font-size:1.12rem;line-height:2.1;margin-bottom:22px}
.letter p.sal{font-family:'Alexandria',sans-serif;font-size:1.2rem;color:var(--burgundy);text-align:center}
.letter p:last-child{margin-bottom:0;font-weight:500;color:var(--wine);text-align:center}
.ending{min-height:92vh;min-height:92dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;margin-top:30px;padding:30px 0}
.ending .e1{font-family:'Alexandria',sans-serif;font-size:clamp(1.5rem,6.5vw,2.1rem);color:var(--rose)}
.ending .e2{font-size:1.3rem;line-height:2;max-width:420px}
.ending .big{font-size:3.4rem;color:var(--rose);text-shadow:0 0 18px #DDA9A4,0 0 50px rgba(221,169,164,.7);animation:beat 2.4s ease-in-out infinite;margin-top:10px}
.star{position:absolute;color:var(--cream);opacity:0;animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.7)}50%{opacity:.9;transform:scale(1.1)}}
.ending .e2.rv{transition-delay:.8s}.ending .big.rv{transition-delay:1.6s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
@media (min-width:700px){.fc{height:170px}.env-grid{gap:26px 22px}}
</style>
</head>
<body>
<div class="bg bg-dark"></div><div class="bg bg-light"></div>
<canvas id="fx"></canvas>
<div id="yt-host" aria-hidden="true"><div id="yt-main"></div><div id="yt-bday"></div></div>
<div id="app"></div>
<div class="audio-ctl" id="audioCtl"><button id="muteBtn" aria-label="تشغيل أو إيقاف الصوت">♪</button><input type="range" id="vol" min="0" max="100" value="50" aria-label="مستوى الصوت"></div>
<div class="dots" id="dots"></div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<div class="ov" id="ov"><div class="ov-stage" id="ovStage"></div></div>

<script>
/* ================================================================
   CONTENT — كل النصوص هون، عدّلها من غير ما تلمس الكود
   ================================================================ */
const CONTENT = {
  siteName: "OUR LITTLE UNIVERSE ♡",
  subtitle: "A WORLD MADE FOR HASHEM",
  music: { main: "6L0sINBLsGU", birthday: "glRTRNZ7oMg" },

  enter: {
    eyebrow: "Before you enter my world",
    line1: "في عالم صغير خبّيتلك فيه كل الحب اللي بقلبي...",
    line2: "هذا العالم إلك وحدك يا حبيبي ♡",
    button: "ادخل عالمنا"
  },

  story: {
    title: "وهيك بلشت حكايتنا...",
    subtitle: "Some stories start unexpectedly... ♡",
    paragraphs: [
      "بتعرف شو أكتر إشي بحبه ببدايتنا؟ إنها ما كانت بداية مخططلها",
      "كان حكيّنا بالبداية عبارة عن شكر ونصائح و IEEE وبعدين صار الحكي يسحب بعضه والوقت يمر بدون ما نحس وكل مرة كانت تنضاف تفاصيل صغيرة لقصتنا",
      "ويمكن هاي من أحلى الصدف اللي بحمد ربنا عليها",
      "وبتعرف؟ لو رجع فيني الزمن لنفس اللحظة ورجعت شفتك بنفس الـ Session ونفس الستوري ونفس الرد رح أكون ممتنة لكل تفصيل وصلني إلك",
      "لأنه من بين كل الأشياء اللي ممكن تصير بهديك الفترة أحلى إشي صار هو إنك صرت جزء من حياتي ❤️"
    ],
    english: "And I wouldn't change a single thing about how we started.",
    timelineTitle: "محطاتنا",
    timeline: [
      { date: "24/08/2025", text: "أول رسالة بيننا" },

/* ================================================================
   Helpers
   ================================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const envHTML = (cls, inner = '', num = '') =>
  `<div class="env ${cls}"><i class="e-paper"></i><i class="e-pocket"></i><i class="e-flap"></i><b class="e-seal">♥</b>${num ? `<span class="e-num">${num}</span>` : ''}${inner}</div>`;

function revealIn(root, sel) {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { root, threshold: .12, rootMargin: '0px 0px -6% 0px' });
  $$(sel + ':not(.in)', root).forEach(n => io.observe(n));
  return io;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ================================================================
   Audio — مشغّلان YouTube، واحد فقط يعمل في كل لحظة
   ================================================================ */
const Audio = (() => {
  const IDS = { main: CONTENT.music.main, bday: CONTENT.music.birthday };
  const P = {}, ready = { main: false, bday: false }, g = { main: 0, bday: 0 }, timers = {};
  let master = .5, muted = false, started = false, inCake = false, cakeOn = false, token = 0, warned = false;
  const PLAYING = 1;
  const st = k => { try { return P[k].getPlayerState(); } catch (e) { return -2; } };
  const apply = k => { try { P[k].setVolume(Math.round(g[k] * master * 100)); } catch (e) {} };
  const applyMute = () => ['main', 'bday'].forEach(k => { try { muted ? P[k].mute() : P[k].unMute(); } catch (e) {} });

  function fadeTo(k, target, ms, cb) {
    clearInterval(timers[k]);
    const from = g[k], t0 = performance.now();
    if (ms <= 0) { g[k] = target; apply(k); cb && cb(); return; }
    timers[k] = setInterval(() => {
      const p = Math.min(1, (performance.now() - t0) / ms);
      g[k] = from + (target - from) * p; apply(k);
      if (p >= 1) { clearInterval(timers[k]); cb && cb(); }
    }, 40);
  }
  function playMain(ms = 2500) {
    if (!ready.main) return;
    try { P.main.playVideo(); } catch (e) {}
    fadeTo('main', 1, ms);
  }
  function initPlayers() {
    const origin = /^https?:/.test(location.protocol) ? location.origin : undefined;
    ['main', 'bday'].forEach(k => {
      P[k] = new YT.Player('yt-' + k, {
        width: 200, height: 200, videoId: IDS[k],
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, origin },
        events: {
          onReady: () => {
            ready[k] = true; apply(k); applyMute();
            if (k === 'main') { if (started) playMain(); else playMain(3000); } // محاولة تشغيل تلقائي
          },
          onStateChange: e => {
            if (e.data === 0) { // ended → loop
              if (k === 'main' && !inCake) { P.main.seekTo(0, true); P.main.playVideo(); }
              if (k === 'bday' && inCake) { P.bday.seekTo(0, true); P.bday.playVideo(); }
            }
          },
          onError: () => { if (!warned) { warned = true; toast('الموسيقى بتشتغل بس لما الموقع يكون منشور على رابط (https)'); } }
        }
      });
    });
  }
  const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = initPlayers;

  return {
    start() { started = true; if (!inCake) playMain(2500); },
    enterCake() {
      const t = ++token; inCake = true; cakeOn = false;
      fadeTo('main', 0, 1400, () => {
        if (t !== token) return;
        try { P.main.pauseVideo(); } catch (e) {}
        cakeOn = true;
        if (ready.bday) { g.bday = 0; apply('bday'); try { P.bday.playVideo(); } catch (e) {} fadeTo('bday', 1, 1500); }
      });
    },
    leaveCake() {
      const t = ++token; inCake = false; cakeOn = false;
      fadeTo('bday', 0, 1000, () => {
        if (t !== token) return;
        try { P.bday.pauseVideo(); } catch (e) {}
        playMain(2600); // يكمل من نفس المكان
      });
    },
    // إعادة محاولة التشغيل عند أي لمسة (قيود المتصفح)
    ensure() {
      if (!started) return;
      if (inCake) { if (cakeOn && ready.bday && st('bday') !== PLAYING && st('bday') !== 3) { try { P.bday.playVideo(); } catch (e) {} } }
      else if (ready.main && st('main') !== PLAYING && st('main') !== 3) { playMain(1500); }
    },
    toggleMute() { muted = !muted; applyMute(); return muted; },
    setVol(v) { master = v; ['main', 'bday'].forEach(apply); if (muted && v > 0) { muted = false; applyMute(); $('#muteBtn').classList.remove('muted'); } }
  };
})();
$('#muteBtn').addEventListener('click', e => e.currentTarget.classList.toggle('muted', Audio.toggleMute()));
$('#vol').addEventListener('input', e => Audio.setVol(e.target.value / 100));
addEventListener('pointerdown', () => Audio.ensure(), { passive: true });

/* ================================================================
   Background particles (hearts + stars)
   ================================================================ */
const FX = (() => {
  const c = $('#fx'), ctx = c.getContext('2d');
  let W, H, dpr, parts = [];
  const N = () => innerWidth < 600 ? 20 : 38;
  function size() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function mk(init) {
    return { x: Math.random() * W, y: init ? Math.random() * H : H + 20, s: 6 + Math.random() * 12, v: .18 + Math.random() * .35, ph: Math.random() * 6.28, star: Math.random() < .45, a: .25 + Math.random() * .45 };
  }
  function heart(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s / 4);
    ctx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s / 4);
    ctx.bezierCurveTo(x - s / 2, y + s / 2, x, y + s * .75, x, y + s);
    ctx.bezierCurveTo(x, y + s * .75, x + s / 2, y + s / 2, x + s / 2, y + s / 4);
    ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s / 4); ctx.fill();
  }
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    const light = document.body.classList.contains('light');
    parts.forEach(p => {
      p.y -= p.v; p.x += Math.sin(t / 1800 + p.ph) * .25;
      if (p.y < -30) Object.assign(p, mk(false));
      const tw = .6 + .4 * Math.sin(t / 700 + p.ph);
      ctx.globalAlpha = p.a * (p.star ? tw : 1);
      if (p.star) { ctx.fillStyle = light ? '#8F2638' : '#FFF9F1'; ctx.beginPath(); ctx.arc(p.x, p.y, p.s / 8, 0, 6.28); ctx.fill(); }
      else { ctx.fillStyle = light ? '#DDA9A4' : '#DDA9A4'; heart(p.x, p.y, p.s); }
    });
    ctx.globalAlpha = 1;
    if (!RM) requestAnimationFrame(frame);
  }
  size(); parts = Array.from({ length: N() }, () => mk(true));
  addEventListener('resize', size);
  requestAnimationFrame(frame);
})();

/* Confetti */
const Confetti = (() => {
  const c = $('#confetti'), ctx = c.getContext('2d');
  let parts = [], raf = 0, dpr = 1;
  const colors = ['#8F2638', '#DDA9A4', '#FFF9F1', '#F5EBDD', '#571B2B', '#e7b96a'];
  function size() { dpr = Math.min(devicePixelRatio || 1, 2); c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  size(); addEventListener('resize', size);
  function burst(x, y, n, spread, power) {
    if (RM) return;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * spread, v = power * (.5 + Math.random() * .6);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .3, col: colors[i % colors.length], life: 0 });
    }
    if (!raf) raf = requestAnimationFrame(loop);
  }
  function loop() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life < 260 && p.y < innerHeight + 30);
    parts.forEach(p => {
      p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - p.life / 260);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    raf = parts.length ? requestAnimationFrame(loop) : 0;
    if (!parts.length) ctx.clearRect(0, 0, innerWidth, innerHeight);
  }
  return { burst };
})();

    },
    enter(root) { setTimeout(() => revealIn(root, '.rv'), 50); }
  };
})();

const SceneLetters = (() => {
  const C = CONTENT.letters;
  const ov = () => $('#ov'), stage = () => $('#ovStage');
  let timer = 0, cur = -1, btns = [];
  function open(i) {
    cur = i; clearTimeout(timer);
    const o = ov(), s = stage();
    s.innerHTML = envHTML('c' + (i % 2), '', '') +
      `<div class="paper" id="paper"><div class="p-num en">${String(i + 1).padStart(2, '0')}</div><div class="p-heart">♥</div>${C.items[i].map(l => `<span class="p-line">${esc(l)}</span>`).join('')}<button class="btn" id="closeLetter">${C.close}</button></div>`;
    o.classList.add('show'); requestAnimationFrame(() => requestAnimationFrame(() => o.classList.add('vis')));
    const env = $('.env', s), paper = $('#paper', s);
    setTimeout(() => env.classList.add('open'), 450);
    timer = setTimeout(() => { env.classList.add('away'); paper.classList.add('show'); }, 2000);
    $('#closeLetter', s).addEventListener('click', close);
    btns[i] && btns[i].classList.add('done');
  }
  function close() {
    clearTimeout(timer); const o = ov();
    o.classList.remove('vis'); setTimeout(() => { o.classList.remove('show'); stage().innerHTML = ''; }, 500); cur = -1;
  }
  return {
    theme: 'light',
    html: `<div class="eyebrow" style="color:var(--burgundy)">Six letters for you</div>
      <h2 class="title">${C.title}</h2>
      <div class="sub">${C.hint}</div>
      <div class="env-grid">
        ${C.items.map((_, i) => `<button class="env-btn rv" aria-label="الرسالة ${i + 1}">${envHTML('c' + (i % 2), '', String(i + 1).padStart(2, '0'))}</button>`).join('')}
      </div>
      <button class="btn rv">${C.next}</button>`,
    mount(root, api) {
      btns = $$('.env-btn', root);
      btns.forEach((b, i) => b.addEventListener('click', () => open(i)));
      ov().addEventListener('click', e => { if (e.target === ov() || e.target === stage()) close(); });
      addEventListener('keydown', e => { if (e.key === 'Escape' && cur >= 0) close(); });
      $('.btn', root).addEventListener('click', api.next);
    },
    enter(root) { setTimeout(() => revealIn(root, '.rv'), 50); },
    leave() { close(); }
  };
})();

const SceneCake = (() => {
  const C = CONTENT.cake;
  let T = [];
  const later = (ms, fn) => { const t = setTimeout(fn, ms); T.push(t); };
  const clearT = () => { T.forEach(clearTimeout); T = []; };
  const cake = `<svg viewBox="0 0 300 320" role="img" aria-label="كيكة عيد ميلاد">
    <defs>
      <radialGradient id="glw" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd58a" stop-opacity=".85"/><stop offset=".5" stop-color="#ffb870" stop-opacity=".3"/><stop offset="1" stop-color="#ffb870" stop-opacity="0"/></radialGradient>
      <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e8782f"/><stop offset=".6" stop-color="#ffb347"/><stop offset="1" stop-color="#fff3c4"/></linearGradient>
    </defs>
    <circle class="glow" id="glow" cx="150" cy="75" r="95" fill="url(#glw)"/>
    <ellipse cx="150" cy="292" rx="125" ry="14" fill="#DDA9A4" opacity=".75"/>
    <ellipse cx="150" cy="288" rx="125" ry="13" fill="#FFF9F1"/>
    <rect x="45" y="205" width="210" height="82" rx="14" fill="#8F2638"/>
    <rect x="45" y="205" width="210" height="24" rx="12" fill="#FFF9F1"/>
    <g fill="#FFF9F1"><circle cx="70" cy="232" r="9"/><circle cx="108" cy="236" r="10"/><circle cx="150" cy="233" r="9"/><circle cx="192" cy="237" r="10"/><circle cx="230" cy="232" r="9"/></g>
    <g fill="#DDA9A4"><circle cx="65" cy="262" r="4"/><circle cx="95" cy="262" r="4"/><circle cx="125" cy="262" r="4"/><circle cx="155" cy="262" r="4"/><circle cx="185" cy="262" r="4"/><circle cx="215" cy="262" r="4"/><circle cx="240" cy="262" r="4"/></g>
    <rect x="85" y="140" width="130" height="68" rx="12" fill="#DDA9A4"/>
    <rect x="85" y="140" width="130" height="20" rx="10" fill="#FFF9F1"/>
    <g fill="#FFF9F1"><circle cx="105" cy="162" r="8"/><circle cx="138" cy="166" r="9"/><circle cx="170" cy="163" r="8"/><circle cx="198" cy="165" r="8"/></g>
    <text x="150" y="196" text-anchor="middle" font-size="22" fill="#8F2638">♥</text>
    <rect x="142" y="98" width="16" height="46" rx="3" fill="#FFF9F1"/>
    <g fill="#DDA9A4"><rect x="142" y="108" width="16" height="5" transform="rotate(-8 150 110)"/><rect x="142" y="122" width="16" height="5" transform="rotate(-8 150 124)"/><rect x="142" y="136" width="16" height="5" transform="rotate(-8 150 138)"/></g>
    <line x1="150" y1="98" x2="150" y2="90" stroke="#302025" stroke-width="2" stroke-linecap="round"/>
    <g class="flame" id="flame"><path d="M150 50C163 68 164 83 150 91 136 83 137 68 150 50Z" fill="url(#fl)"/><path d="M150 69C156 77 156 85 150 89 144 85 144 77 150 69Z" fill="#fff8dc" opacity=".9"/></g>
    <g class="wind" id="wind"><path d="M215 62C190 60 175 66 160 70"/><path d="M225 76C198 75 180 79 162 82"/><path d="M212 90C192 90 178 92 164 94"/></g>
    <g class="smoke" id="smoke"><circle cx="150" cy="86" r="7" style="--dx:-10px"/><circle cx="150" cy="86" r="6" style="--dx:12px"/><circle cx="150" cy="86" r="7" style="--dx:-6px"/><circle cx="150" cy="86" r="5" style="--dx:9px"/></g>
    <rect class="hit" id="hit" x="108" y="30" width="84" height="116" fill="transparent"/>
  </svg>`;
  return {
    theme: 'light',
    html: `<div class="eyebrow" style="color:var(--burgundy)">The birthday moment</div>
      <div class="cake-wrap" id="cakeWrap">${cake}</div>
      <div class="cake-t1 display">${C.t1}</div>
      <div class="cake-t2">${C.t2}</div>
      <div class="cake-t3">${C.t3}</div>
      <div class="cake-hint" id="cakeHint">${C.hint}</div>
      <div class="after" id="after">
        <div class="wish">${C.wish}</div>
        <div class="hb">${C.hb}</div>
        <div class="acts"><button class="btn ghost" id="again">${C.again}</button><button class="btn" id="toFinal">${C.next}</button></div>
      </div>`,
    mount(root, api) {
      const $r = s => $(s, root);
      let state = 'lit';
      const flame = $r('#flame'), wind = $r('#wind'), smoke = $r('#smoke'), glow = $r('#glow'), after = $r('#after'), hint = $r('#cakeHint');
      function hearts() {
        if (RM) return;
        for (let i = 0; i < 16; i++) {
          const h = document.createElement('span'); h.className = 'fh'; h.textContent = '♥';
          h.style.left = Math.random() * 100 + 'vw'; h.style.fontSize = 14 + Math.random() * 22 + 'px';
          h.style.animationDuration = 3.5 + Math.random() * 3 + 's'; h.style.animationDelay = Math.random() * 1.2 + 's';
          document.body.appendChild(h); setTimeout(() => h.remove(), 8000);
        }
      }
      function blow() {
        if (state !== 'lit') return; state = 'blowing';
        flame.classList.add('blow'); wind.classList.add('show');
        later(1300, () => {
          flame.style.display = 'none'; wind.classList.remove('show'); glow.style.opacity = 0;
          smoke.classList.remove('go'); void smoke.getBoundingClientRect(); smoke.classList.add('go');
          const r = $r('#cakeWrap').getBoundingClientRect();
          Confetti.burst(r.left + r.width / 2, r.top + r.height * .35, 90, 2.6, 13);
          Confetti.burst(0, innerHeight, 60, 1.2, 17); Confetti.burst(innerWidth, innerHeight, 60, 1.2, 17);
          later(500, () => Confetti.burst(innerWidth / 2, innerHeight * .8, 70, 2.2, 16));
          hearts();
          hint.classList.add('hide');
          after.classList.remove('show'); void after.offsetWidth; after.classList.add('show');
          state = 'out';
          later(300, () => after.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'center' }));
        });
      }
      function relight() {
        clearT(); state = 'lit';
        flame.style.display = ''; flame.classList.remove('blow'); wind.classList.remove('show'); glow.style.opacity = 1;
        smoke.classList.remove('go'); after.classList.remove('show'); hint.classList.remove('hide');
      }
      const hit = $r('#hit');
      hit.addEventListener('click', blow); hit.addEventListener('touchstart', e => { e.preventDefault(); blow(); }, { passive: false });
      flame.style.cursor = 'pointer';
      $r('#again').addEventListener('click', relight);
      $r('#toFinal').addEventListener('click', api.next);
      root._relight = relight;
    },
    enter(root) {
      root._relight && root._relight();
      root.classList.remove('seq-p'); void root.offsetWidth; root.classList.add('seq-p');
      Audio.enterCake();
    },
    leave() { clearT(); Audio.leaveCake(); }
  };
})();

const SceneFinal = (() => {
  const C = CONTENT.finalLetter;
  return {
    theme: 'dark',
    html: `<div class="eyebrow">My last letter to you</div>
      <h2 class="title display">${C.title}</h2>
      <div class="final-env-wrap" id="fWrap">
        <button class="final-env-btn" id="fEnv" aria-label="افتح الرسالة">${envHTML('')}<div class="cap">${C.envelope}</div></button>
      </div>
      <article class="letter" id="letter">
        <p class="sal rv">${esc(C.salutation)}</p>
        ${C.paragraphs.map(p => `<p class="rv">${esc(p)}</p>`).join('')}
      </article>
      <section class="ending" id="ending">
        <span class="star" style="top:8%;right:12%">✦</span><span class="star" style="top:18%;left:10%;animation-delay:.8s">✧</span>
        <span class="star" style="top:46%;right:6%;animation-delay:1.4s">✦</span><span class="star" style="bottom:22%;left:14%;animation-delay:.4s">✧</span>
        <span class="star" style="bottom:8%;right:22%;animation-delay:2s">✦</span><span class="star" style="top:33%;left:4%;animation-delay:2.6s">✦</span>
        <div class="e1 rv">${C.end1}</div>
        <div class="e2 rv">${C.end2}</div>
        <div class="big rv">♥</div>
      </section>`,
    mount(root) {
      const envBtn = $('#fEnv', root), env = $('.env', envBtn), wrap = $('#fWrap', root), letter = $('#letter', root), ending = $('#ending', root);
      ending.style.display = 'none';
      envBtn.addEventListener('click', () => {
        if (env.classList.contains('open')) return;
        env.classList.add('open');
        setTimeout(() => {
          wrap.classList.add('gone'); letter.classList.add('show'); ending.style.display = '';
          root.scrollTo({ top: 0 });
          setTimeout(() => revealIn(root, '.rv'), 200);
        }, 1700);
      });
    }
  };
})();

/* ================================================================
   Scene manager
   ================================================================ */
const defs = [SceneEnter, SceneStory, SceneFavorite, SceneLetters, SceneCake, SceneFinal];
const app = $('#app'), roots = [];
let cur = -1, busy = false;
const dotsEl = $('#dots');
dotsEl.innerHTML = defs.slice(1).map(() => '<i></i>').join('');

function go(i) {
  if (busy || i === cur || i >= defs.length) return;
  busy = true;
  const prev = cur;
  if (prev >= 0) { roots[prev].classList.remove('active'); defs[prev].leave && defs[prev].leave(roots[prev]); }
  cur = i;
  document.body.classList.toggle('light', defs[i].theme === 'light');
  dotsEl.classList.toggle('show', i > 0);
  $$('i', dotsEl).forEach((d, k) => d.classList.toggle('on', k === i - 1));
  setTimeout(() => {
    roots[i].scrollTop = 0; roots[i].classList.add('active');
    defs[i].enter && defs[i].enter(roots[i]);
    busy = false;
  }, prev >= 0 ? 600 : 0);
}
defs.forEach((d, i) => {
  const s = document.createElement('section');
  s.className = 'scene ' + d.theme;
  s.innerHTML = `<div class="scene-inner">${d.html}</div>`;
  app.appendChild(s); roots.push(s);
  d.mount && d.mount(s, { next: () => go(i + 1) });
});
go(0);
</script>
